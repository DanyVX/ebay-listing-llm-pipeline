[build-system]
requires = ["setuptools==83.0.0", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-listing-llm-pipeline"
version = "0.0.0"
description = "Synthetic-only grounded structured-generation pipeline for marketplace listings"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{name = "Danial Hassan"}]
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.14.2",
  "PyYAML==6.0.3",
  "typer==0.26.3",
  "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.14.4",
  "mypy==1.18.2",
  "hypothesis==6.142.4",
  "pre-commit==4.3.0",
  "pip-audit==2.9.0",
  "setuptools==83.0.0",
]

[project.scripts]
elp = "elp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: opt-in slow tests", "gpu: opt-in GPU tests", "live: opt-in provider calls"]

[tool.coverage.run]
source = ["elp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
