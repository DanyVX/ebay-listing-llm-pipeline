name: Milestone formatting

on:
  push:
    branches:
      - 'm[0-9]*'

permissions:
  contents: write

jobs:
  formatting:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff autofix and formatting (milestone branches only)
        run: |
          python -m pip install ruff==0.14.4
          python -m ruff check --fix src tests scripts
          python -m ruff format src tests scripts
      - name: Commit formatting-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests scripts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff formatting to milestone"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
